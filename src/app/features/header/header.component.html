<header class="header">
  <div class="header__bar">
    @if (showIdentity() && profileService.profile(); as profile) {
      <a class="header__identity" href="#inicio">
        <img [src]="profile.avatarUrl" [alt]="profile.name" />
        <span>{{ profile.name }}</span>
      </a>
    } @else {
      <a class="header__logo" href="#inicio">Ramses</a>
    }

    <button
      class="header__toggle"
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-label="Menú"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav class="header__nav" [class.header__nav--open]="menuOpen()">
      @for (link of links; track link.id) {
        <a [href]="'#' + link.fragment" (click)="closeMenu()">
          {{ 'nav.' + link.id | translate }}
        </a>
      }
      <app-theme-toggle />
      <app-lang-toggle />
    </nav>
  </div>
</header>
