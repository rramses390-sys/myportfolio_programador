<footer class="footer">
  @if (profileService.profile(); as profile) {
  <div class="footer__social">
    @for (link of profile.social; track link.url) {
    <a [href]="link.url" target="_blank" rel="noopener" [attr.aria-label]="link.label">
      <app-icon [name]="link.icon" />
    </a>
    }
  </div>
  }

  <p class="footer__rights">{{ 'footer.rights' | translate }}</p>
</footer>
