<section class="contact" id="contacto">
  <header class="contact__header">
    <h2 class="contact__title">{{ 'contact.title' | translate }}</h2>
    <p class="contact__eyebrow">{{ 'contact.eyebrow' | translate }}</p>
  </header>

  @if (profileService.profile(); as profile) {
  <a class="contact__pill" [href]="'mailto:' + profile.email">
    <span class="contact__pill-icon"><app-icon name="mail" /></span>
    {{ profile.email }}
  </a>
  @if (profileService.profile(); as profile) {
  <div class="contact__pills">
    <a class="contact__pill" [href]="'mailto:' + profile.email">
      <span class="contact__pill-icon"><app-icon name="mail" /></span>
      {{ profile.email }}
    </a>
    <a class="contact__pill" [href]="'tel:' + profile.phone">
      <span class="contact__pill-icon"><app-icon name="phone" /></span>
      {{ profile.phone }}
    </a>
  </div>
}
  }
</section>
